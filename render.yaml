services:
  - type: web
    name: rag-agent-platform
    runtime: node
    plan: free
    rootDir: ai-session-7
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set secrets in the Render dashboard (do not commit):
      # GROQ_API_KEY, DATABASE_URL (Neon pooled), FRONTEND_URL
